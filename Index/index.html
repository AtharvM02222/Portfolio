  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YH75G12GCG"></script>

    function gtag(){dataLayer.push(arguments);}

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Rowdies:wght@400;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body, html {
      height: 100%;
      font-family: 'Rowdies', sans-serif;
      background-color: #000;
      overflow: hidden;
    }

    #loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    #typewriter-container {
      font-size: 30px;
      color: white;
      text-align: center;
    }

    #typewriter-text {
      border-right: 2px solid red;
      padding-right: 5px;
      animation: blink 0.75s step-end infinite;
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div id="typewriter-container">
      <span id="typewriter-text"></span>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const text = " Opening portfolio...";
      const typewriterEl = document.getElementById("typewriter-text");
      
      // Redirect to main page
      const mainPageURL = 'main.html';
      
      let i = 0;
      
      function typeWriter() {
        typewriterEl.textContent = text.substring(0, i);
        i++;

        if (i > text.length) {
          setTimeout(function() {
            window.location.href = mainPageURL;
          }, 400);
        } else {
          setTimeout(typeWriter, 90);
        }
      }
      
      typeWriter();
      
      // Fallback redirect
      setTimeout(() => {
        window.location.href = mainPageURL;
      }, 2400);
    });
  </script>
</body>
</html>
