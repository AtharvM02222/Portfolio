  <style>
    .projects-grid {
      display: grid;
      gap: 2rem;
      max-width: 1000px;
      margin: 0 auto;
    }
    
    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 2.5rem;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }
    
    .project-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transform: scaleX(0);
      transition: transform 0.3s ease;
    }
    
    .project-card:hover::before {
      transform: scaleX(1);
    }
    
    .project-card:hover {
      transform: translateY(-5px);
      border-color: var(--primary);
    }
    
    .project-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.5rem;
    }
    
    .project-title {
      font-family: 'Rowdies', sans-serif;
      font-size: 1.8rem;
      color: var(--text);
    }
    
    .project-title span {
      color: var(--primary);
    }
    
    .project-badge {
      background: rgba(230, 207, 120, 0.1);
      color: var(--primary);
      padding: 0.4rem 1rem;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    
    .project-desc {
      color: var(--text-muted);
      line-height: 1.8;
      margin-bottom: 1.5rem;
    }
    
    .project-desc ul {
      margin: 1rem 0 1rem 1.5rem;
    }
    
    .project-desc li {
      margin-bottom: 0.5rem;
    }
    
    .project-desc strong {
      color: var(--primary);
    }
    
    .project-links {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    
    .project-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      transition: var(--transition);
    }
    
    .project-link:hover {
      color: var(--accent);
    }
    
    .tech-stack {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.5rem;
      flex-wrap: wrap;
    }
    
    .tech-tag {
      background: rgba(0, 234, 255, 0.1);
      color: var(--accent);
      padding: 0.3rem 0.8rem;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    
    .project-images {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }
    
    .project-images img {
      width: 100%;
      border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
    }
    
    .certificate-frame {
      margin-top: 1.5rem;
      border-radius: var(--radius-sm);
      overflow: hidden;
      border: 1px solid var(--glass-border);
    }
    
    .certificate-frame iframe {
      display: block;
    }

    /* Work Stats */
    .work-stats {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
      margin-bottom: 3rem;
      padding: 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }

    .stat-item {
      text-align: center;
    }

    .stat-item .stat-value {
      font-family: 'Rowdies', sans-serif;
      font-size: 2rem;
      color: var(--primary);
    }

    .stat-item .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Filter buttons enhancement */
    .filter-buttons {
      margin-bottom: 2rem;
    }
  </style>

  <script>
    // Work page - Load projects from JSON
    let workData = null;
    let currentFilter = 'all';

    // Create project card HTML
    function createProjectCard(project) {
      const featuresHTML = project.features.map(f => `<li>${f}</li>`).join('');
      const linksHTML = project.links.map(l => 
        `<a href="${l.url}" target="_blank" class="project-link">${l.icon} ${l.label}</a>`
      ).join('');
      const techHTML = project.tech.map(t => `<span class="tech-tag">${t}</span>`).join('');
      const imagesHTML = project.images.length > 0 
        ? `<div class="project-images">${project.images.map(img => `<img src="${img}" alt="${project.title}">`).join('')}</div>` 
        : '';
      const certificateHTML = project.certificateEmbed 
        ? `<div class="certificate-frame"><iframe src="${project.certificateEmbed}" width="100%" height="400" frameborder="0"></iframe></div>` 
        : '';

      return `
        <article class="project-card fade-in visible" data-category="${project.category}">
          <div class="project-header">
            <h2 class="project-title">${project.title.replace(project.highlight, `<span>${project.highlight}</span>`)}</h2>
            <span class="project-badge">${project.badge}</span>
          </div>
          
          <p class="project-desc">
            ${project.description}
            ${project.features.length > 0 ? `<ul>${featuresHTML}</ul>` : ''}
          </p>
          
          <div class="project-links">${linksHTML}</div>
          
          <div class="tech-stack">${techHTML}</div>
          
          ${imagesHTML}
          ${certificateHTML}
        </article>
      `;
    }

    // Create filter buttons
    function createFilterButtons(categories) {
      const container = document.getElementById('filterButtons');
      const allBtn = `<button class="filter-btn active" data-filter="all">All</button>`;
      const categoryBtns = categories.map(cat => 
        `<button class="filter-btn" data-filter="${cat.id}">${cat.icon} ${cat.name}</button>`
      ).join('');
      container.innerHTML = allBtn + categoryBtns;

      // Add click handlers
      container.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          filterProjects(btn.dataset.filter);
        });
      });
    }

    // Filter projects
    function filterProjects(filter) {
      currentFilter = filter;
      const cards = document.querySelectorAll('.project-card');
      cards.forEach(card => {
        if (filter === 'all' || card.dataset.category === filter) {
          card.style.display = 'block';
          card.classList.add('visible');
        } else {
          card.style.display = 'none';
          card.classList.remove('visible');
        }
      });
    }

    // Create stats
    function createStats(stats) {
      const container = document.getElementById('workStats');
      container.innerHTML = `
        <div class="stat-item">
          <div class="stat-value">${stats.totalProjects}</div>
          <div class="stat-label">Projects</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">${stats.githubRepos}</div>
          <div class="stat-label">Repos</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">${stats.githubStars}</div>
          <div class="stat-label">Stars</div>
        </div>
        <div class="stat-item">
          <div class="stat-value">${stats.gamesPublished}</div>
          <div class="stat-label">Games</div>
        </div>
      `;
    }

    // Load work data
    async function loadWorkData() {
      try {
        const response = await fetch('work-data.json');
        workData = await response.json();

        // Render filter buttons
        createFilterButtons(workData.categories);

        // Render stats
        createStats(workData.stats);

        // Render projects
        const grid = document.getElementById('projectsGrid');
        grid.innerHTML = workData.projects.map(createProjectCard).join('');

      } catch (error) {
        console.error('Failed to load work data:', error);
        document.getElementById('projectsGrid').innerHTML = 
          '<p style="color: var(--text-muted); text-align: center;">Unable to load projects</p>';
      }
    }

    // Initialize
    loadWorkData();
  </script>
