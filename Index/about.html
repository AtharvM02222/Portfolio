<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#161616">
  <title>About | Atharv Mandlavdiya</title>
  <link rel="icon" type="image/svg+xml" href="am.svg">
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Rowdies:wght@300&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Jacquard+12&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">

  <style>
    h7 {
      font-family: 'Rowdies', sans-serif;
      font-size: 170px;
      color: red;
    }
  </style>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YH75G12GCG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YH75G12GCG');
  </script>
</head>

<body class="full" bgcolor="rgb(0,0,0)">
  <header>
    <div class="brandingg">
      <div id="brandingg">
        <a href="main.html" class="brandingg">
          <h6 class="nameStyle" style="color: rgb(255, 255, 255); font-size: 30px;">
            atharv<span style="color: rgb(230, 207, 120);">mandlavdiya</span>
          </h6>
        </a>
      </div>
    </div>
  </header>

  <audio id="bg-music" loop autoplay>
    <source src="Theme.mp3" type="audio/mp3">
  </audio>

  <div class="new" style="margin-top:100px; text-align: center;">
    <h7>Time I've Been Alive:</h7>
    <div id="lifeTimer" style="display:flex; justify-content:center; font-size:40px; flex-wrap:wrap; gap:30px; margin-top:30px;">
      <div>
        <span id="lifeYears" style="font-size:120px; font-weight:bold; color: white;">00</span>
        <div class="label">Years</div>
      </div>
      <div>
        <span id="lifeDays" style="font-size:120px; font-weight:bold; color: white;">00</span>
        <div class="label">Days</div>
      </div>
      <div>
        <span id="lifeHours" style="font-size:120px; font-weight:bold; color: white;">00</span>
        <div class="label">Hours</div>
      </div>
      <div>
        <span id="lifeMinutes" style="font-size:120px; font-weight:bold; color: white;">00</span>
        <div class="label">Minutes</div>
      </div>
      <div>
        <span id="lifeSeconds" style="font-size:120px; font-weight:bold; color: white;">00</span>
        <div class="label">Seconds</div>
      </div>
    </div>
  </div>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (window.netlifyIdentity) {
        netlifyIdentity.init();
        netlifyIdentity.on("login", () => {
          window.location.href = "cloud.html";
        });
      }
    });

    document.addEventListener("selectionchange", () => {
      if (window.getSelection().toString().trim() === "Alive" && window.netlifyIdentity) {
        netlifyIdentity.open();
      }
    });
  </script>

  <script src="about.js"></script>
  <script src="version-switcher.js"></script>
  <script src="location-tracker.js"></script>
</body>
</html>
