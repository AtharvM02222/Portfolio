  <div class="new" style="margin-top:100px;">
    <h7>Time I've Been Alive:</h7>
    <div id="lifeTimer" style="display:flex; justify-content:center; font-size:40px; flex-wrap:wrap; gap:30px; margin-top:30px;">
      <div>
        <span id="lifeYears" style="font-size:120px; font-weight:bold;">00</span>
        <div class="label">Years</div>
      </div>
      <div>
        <span id="lifeDays" style="font-size:120px; font-weight:bold;">00</span>
        <div class="label">Days</div>
      </div>
      <div>
        <span id="lifeHours" style="font-size:120px; font-weight:bold;">00</span>
        <div class="label">Hours</div>
      </div>
      <div>
        <span id="lifeMinutes" style="font-size:120px; font-weight:bold;">00</span>
        <div class="label">Minutes</div>
      </div>
      <div>
        <span id="lifeSeconds" style="font-size:120px; font-weight:bold;">00</span>
        <div class="label">Seconds</div>
      </div>
    </div>
  </div>

  <script>
    // Life counter
    const birthDate = new Date(2011, 5, 8, 21, 8, 0);
    function updateLifeCounter() {
      const now = new Date();
      let diff = now - birthDate;
      let totalSeconds = Math.floor(diff / 1000);
      const years = Math.floor(totalSeconds / (365.25 * 24 * 60 * 60));
      totalSeconds -= Math.floor(years * 365.25 * 24 * 60 * 60);
      const days = Math.floor(totalSeconds / (24 * 60 * 60));
      totalSeconds -= days * 24 * 60 * 60;
      const hours = Math.floor(totalSeconds / (60 * 60));
      totalSeconds -= hours * 60 * 60;
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      document.getElementById('lifeYears').textContent = years.toString().padStart(2, '0');
      document.getElementById('lifeDays').textContent = days.toString().padStart(2, '0');
      document.getElementById('lifeHours').textContent = hours.toString().padStart(2, '0');
      document.getElementById('lifeMinutes').textContent = minutes.toString().padStart(2, '0');
      document.getElementById('lifeSeconds').textContent = seconds.toString().padStart(2, '0');
    }
    updateLifeCounter();
    setInterval(updateLifeCounter, 1000);
  </script>
