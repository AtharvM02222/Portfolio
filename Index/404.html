<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0f">
  <title>404 | Page Not Found</title>
  <link rel="icon" type="image/svg+xml" href="am.svg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Rowdies:wght@300;400;700&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --primary: #e6cf78;
      --bg-dark: #0a0a0f;
      --text: #ffffff;
      --text-muted: #a0a0b0;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .container {
      text-align: center;
      padding: 2rem;
      position: relative;
      z-index: 1;
    }
    
    .error-code {
      font-family: 'Rowdies', sans-serif;
      font-size: clamp(8rem, 25vw, 15rem);
      line-height: 1;
      background: linear-gradient(135deg, var(--primary) 0%, #ff6b6b 50%, #00d4ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: glitch 2s infinite;
      position: relative;
    }
    
    .error-code::before,
    .error-code::after {
      content: '404';
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, var(--primary) 0%, #ff6b6b 50%, #00d4ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .error-code::before {
      animation: glitch-1 0.3s infinite;
      clip-path: polygon(0 0, 100% 0, 100% 35%, 0 35%);
    }
    
    .error-code::after {
      animation: glitch-2 0.3s infinite;
      clip-path: polygon(0 65%, 100% 65%, 100% 100%, 0 100%);
    }
    
    @keyframes glitch-1 {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-3px, 3px); }
      40% { transform: translate(3px, -3px); }
      60% { transform: translate(-3px, -3px); }
      80% { transform: translate(3px, 3px); }
    }
    
    @keyframes glitch-2 {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(3px, -3px); }
      40% { transform: translate(-3px, 3px); }
      60% { transform: translate(3px, 3px); }
      80% { transform: translate(-3px, -3px); }
    }
    
    h1 {
      font-family: 'Rowdies', sans-serif;
      font-size: 2rem;
      margin: 1rem 0;
    }
    
    p {
      color: var(--text-muted);
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }
    
    .home-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--primary);
      color: #000;
      text-decoration: none;
      padding: 1rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .home-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(230, 207, 120, 0.3);
    }
    
    /* Floating astronaut */
    .astronaut {
      font-size: 4rem;
      animation: float 3s ease-in-out infinite;
      margin-bottom: 1rem;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(5deg); }
    }
    
    /* Background stars */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
    }
    
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite;
    }
    
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  
  <div class="container">
    <div class="astronaut">🧑‍🚀</div>
    <div class="error-code">404</div>
    <h1>Lost in Space</h1>
    <p>The page you're looking for has drifted into the void.</p>
    <a href="main.html" class="home-btn">← Back to Earth</a>
  </div>

  <script>
    // Generate stars
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 100; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 2 + 's';
      star.style.width = (1 + Math.random() * 2) + 'px';
      star.style.height = star.style.width;
      starsContainer.appendChild(star);
    }
  </script>
</body>
</html>
